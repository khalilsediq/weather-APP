<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Weather App</title>
    <!-- Link to our CSS file for styling -->
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts for a premium look -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Live Background Elements -->
    <div class="background-scene">
      <div class="sun"></div>
      <div class="moon"></div>
      <div class="stars"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>
    <!-- Main Container: Holds everything in the center -->
    <div class="app-container">
      <!-- Header: The search section -->
      <div class="search-box">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name..."
          spellcheck="false"
        />
        <button id="searchBtn">
          Search
        </button>
      </div>

      <!-- Error Message: Shown when city is not found -->
      <div class="error" id="errorMessage">
        <p>Invalid city name</p>
      </div>

      <!-- Container: Weather cards will be added here -->
      <div id="weatherContainer">
        <!-- New weather cards go here -->
      </div>
    </div>

    <!-- Link to our JavaScript file where the logic lives -->
    <script src="app.js"></script>
  </body>
</html>
